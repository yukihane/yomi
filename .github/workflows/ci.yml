# This workflow is managed by gh actions-lock.

name: ci
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup | Development environment
        uses: $/.github/actions/setup

      - name: Run | Format
        run: pnpm run format:check

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup | Development environment
        uses: $/.github/actions/setup

      - name: Run | Lint
        run: pnpm run lint --deny-warnings

  typecheck:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup | Development environment
        uses: $/.github/actions/setup

      - name: Run | Typecheck
        run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup | Development environment
        uses: $/.github/actions/setup

      - name: Run | Test
        run: pnpm run test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup | Development environment
        uses: $/.github/actions/setup

      - name: Build | Extension
        run: pnpm run build

      - name: 診断 | 追加インストール前のシステムブラウザー
        env:
          CHROMIUM_PATH: /usr/bin/chromium
          DEBUG: pw:browser
        run: |
          ls -l /usr/bin/chromium
          /usr/bin/chromium --version
          node scripts/diagnose-chromium.mjs

      - name: Setup | Chromium
        run: pnpm exec playwright-core install --with-deps --no-shell chromium

      - name: 診断 | 追加インストール後のシステムブラウザー
        env:
          CHROMIUM_PATH: /usr/bin/chromium
          DEBUG: pw:browser
        run: node scripts/diagnose-chromium.mjs

      - name: Run | E2E
        env:
          E2E_SCREENSHOT_DIR: ${{ runner.temp }}/screenshots
        run: |
          mkdir -p "$E2E_SCREENSHOT_DIR"
          export CHROMIUM_PATH="$(node -p "require('playwright-core').chromium.executablePath()")"
          pnpm run test:e2e

      - name: Upload | Screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  status-check:
    needs: [format, lint, typecheck, test, e2e]
    if: ${{ always() }}
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Verify | All CI jobs succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(.[]; . == "success")' <<< "$RESULTS"
